name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'output/data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Copy data files into build output
        run: |
          mkdir -p web/dist/output/data web/dist/output/data/tickers
          for f in \
            index.json \
            dashboard.json \
            dashboard_history.json \
            price_history.json \
            ticker_timelines.json \
            backtest_summary.json \
            monthly_summary.json \
            api_status.json \
            api_ticker_matrix.json \
            api_ticker_matrix.csv \
            analysis_quality.json \
            cost_log.json \
            routing_outcome.json \
            direction_alignment.json \
            ab_test_results.json \
            calibration.json \
            factor_audit.json \
            signal_quality.json \
            policy_impact.json \
            sectors.json \
            tuning_report.json \
            validation_warnings.json; do
            cp "output/data/$f" web/dist/output/data/ 2>/dev/null || echo "No $f yet"
          done
          cp -R output/data/tickers/. web/dist/output/data/tickers/ 2>/dev/null || echo "No ticker shards yet"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
