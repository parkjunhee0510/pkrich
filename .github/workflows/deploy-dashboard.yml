name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'output/data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy data files into build output
        run: |
          mkdir -p web/dist/output/data
          cp output/data/dashboard.json web/dist/output/data/ 2>/dev/null || echo "No dashboard.json yet"
          cp output/data/price_history.json web/dist/output/data/ 2>/dev/null || echo "No price_history.json yet"
          cp output/data/ticker_timelines.json web/dist/output/data/ 2>/dev/null || echo "No ticker_timelines.json yet"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
